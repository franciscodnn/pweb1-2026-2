<header
  class="bg-slate-100 border-b border-slate-300 dark:bg-slate-900 dark:border-slate-700 px-6 py-4 flex items-center justify-between">
  <span class="text-xl font-bold text-indigo-600 dark:text-indigo-400">FD<span
      class="text-slate-800 dark:text-white">.dev</span></span>

  <!-- two-way binding com model(): o filho altera o signal do pai -->
  <theme-button [(darkMode)]="darkMode" />
</header>

<main>

  <!-- Seção: Perfil -->
  <section class="bg-slate-200 dark:bg-slate-800 px-6 py-16 text-center">
    <img src="https://ui-avatars.com/api/?name=Francisco&background=random&size=128&rounded=true&bold=true"
      alt="Foto de Francisco Dantas" class="w-28 h-28 rounded-full mx-auto mb-4 ring-4 ring-indigo-500" />
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-1">Francisco Dantas</h1>
    <p class="text-indigo-600 dark:text-indigo-400 font-medium mb-4">Desenvolvedor Full Stack</p>
    <p class="text-slate-600 dark:text-slate-400 max-w-lg mx-auto">
      Entusiasta de tecnologias como Angular, Node.js e boas práticas de desenvolvimento.
    </p>
  </section>

  <!-- Seção: Projetos -->
  <section class="bg-slate-50 dark:bg-slate-950 px-6 py-16">
    <div class="max-w-4xl mx-auto">
      <div class="flex items-center justify-between mb-10">
        <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Projetos</h2>
        <button type="button" (click)="showForm.update(show => !show)"
          class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
          {{ showForm() ? 'Cancelar' : '+ Novo projeto' }}
        </button>
      </div>

      @if (showForm()) {
        <div class="mb-10">
          <app-project-form (saved)="showForm.set(false)" />
        </div>
      }

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (project of projects(); track project.id) {
          <app-project-card
            [title]="project.title"
            [description]="project.description"
            [techs]="project.techs"
            [repoUrl]="project.repoUrl"
            [yearsExperience]="project.yearsExperience"
            (selected)="selectedProject.set(project)"
          />
        }
      </div>
    </div>
  </section>

  @if (selectedProject(); as project) {
    <app-project-detail [project]="project" (close)="selectedProject.set(null)" />
  }

</main>

<footer class="bg-slate-100 border-t border-slate-300 dark:bg-slate-900 dark:border-slate-700 py-8 text-center">
  <p class="text-slate-500 text-sm">&copy; 2026 Francisco Dantas</p>
</footer>
