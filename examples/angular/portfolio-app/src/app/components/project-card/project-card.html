<article (click)="selected.emit()" (keydown.enter)="selected.emit()" tabindex="0" role="button"
  class="relative h-full bg-slate-100 dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 flex flex-col gap-3 cursor-pointer hover:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
  <h3 class="text-slate-900 dark:text-white font-semibold text-lg">{{ title() }}</h3>
  <p class="text-slate-500 dark:text-slate-400 text-sm flex-1">{{ description() }}</p>

  <div class="flex flex-wrap gap-2">
    @for (tech of techs(); track tech) {
      <span
        class="text-xs px-2 py-1 bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 rounded-full">
        {{ tech }}
      </span>
    }
  </div>

  <!-- stopPropagation: abrir o repositório não deve abrir o detalhe -->
  <a [href]="repoUrl()" target="_blank" rel="noopener noreferrer" (click)="$event.stopPropagation()"
    class="text-sm text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 dark:hover:text-indigo-300 transition-colors">
    Ver repositório &rarr;
  </a>

  <span
    class="absolute bottom-2 right-2 text-xs px-2 py-1 bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 rounded-full">
    {{ yearsExperience() }} {{ yearsExperience() === 1 ? 'ano' : 'anos' }}
  </span>
</article>
