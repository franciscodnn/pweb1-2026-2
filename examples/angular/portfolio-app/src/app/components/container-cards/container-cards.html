<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
@for (project of projects(); track project.id) {
    <a routerLink="projeto/{{ project.id }}">
        <app-project-card
        [title]="project.title"
        [description]="project.description"
        [techs]="project.techs"
        [repoUrl]="project.repoUrl"
        [yearsExperience]="project.yearsExperience"
        (selected)="selectedProject.set(project)"
        />
    </a>
}
</div>
