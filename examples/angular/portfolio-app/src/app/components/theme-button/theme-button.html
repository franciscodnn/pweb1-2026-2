<button
  (click)="toggleTheme()"
  class="w-9 h-9 flex items-center justify-center rounded-full text-lg border border-slate-300 dark:border-slate-700 hover:border-indigo-400 hover:text-indigo-400 text-slate-500 dark:text-slate-300 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500"
  [attr.aria-label]="darkMode() ? 'Ativar tema claro' : 'Ativar tema escuro'"
  [attr.title]="darkMode() ? 'Ativar tema claro' : 'Ativar tema escuro'"
>
  <span class="grayscale">{{ darkMode() ? '☀️' : '🌙' }}</span>
</button>
