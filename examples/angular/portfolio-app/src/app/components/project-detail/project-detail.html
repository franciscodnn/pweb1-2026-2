<!-- fundo escurecido: clicar fora do painel também fecha -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" (click)="close.emit()">
  <article role="dialog" aria-modal="true" [attr.aria-label]="project().title"
    class="w-full max-w-lg bg-slate-100 dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700 shadow-xl space-y-4"
    (click)="$event.stopPropagation()">

    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-xs text-slate-500 dark:text-slate-400">Projeto #{{ project().id }}</p>
        <h3 class="text-2xl font-bold text-slate-900 dark:text-white">{{ project().title }}</h3>
      </div>
      <button type="button" (click)="close.emit()" aria-label="Fechar"
        class="w-8 h-8 flex items-center justify-center rounded-full text-slate-500 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">
        &times;
      </button>
    </div>

    <p class="text-slate-600 dark:text-slate-300">{{ project().description }}</p>

    <div>
      <h4 class="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-2">Tecnologias</h4>
      <div class="flex flex-wrap gap-2">
        @for (tech of project().techs; track tech) {
          <span
            class="text-xs px-2 py-1 bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 rounded-full">
            {{ tech }}
          </span>
        }
      </div>
    </div>

    <p class="text-sm text-slate-600 dark:text-slate-300">
      <span class="font-semibold">Experiência:</span>
      {{ project().yearsExperience }} {{ project().yearsExperience === 1 ? 'ano' : 'anos' }}
    </p>

    <a [href]="project().repoUrl" target="_blank" rel="noopener noreferrer"
      class="inline-block rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
      Ver repositório &rarr;
    </a>
  </article>
</div>
